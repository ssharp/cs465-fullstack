<div class="row">
  <div class="col-12 col-md-8">
    <h2>Login</h2>

    <!-- Activate Angular's template-driven form system -->
    <form #f="ngForm" (ngSubmit)="onLoginSubmit()">

      <!-- Error message -->
      <div role="alert" *ngIf="formError" class="alert alert-danger">
        {{ formError }}
      </div>

      <!-- Name -->

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email Address</label>
        <input
          type="email"
          id="email"
          name="email"
          class="form-control"
          placeholder="Enter email address"
          required
          [(ngModel)]="credentials.email">
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          name="password"
          class="form-control"
          placeholder="e.g. 12+ alphanumerics"
          required
          [(ngModel)]="credentials.password">
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="f.invalid">
        Sign In!
      </button>

    </form>
  </div>
</div>
